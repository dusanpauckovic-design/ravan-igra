<!doctype html>
<html lang="sr-Latn">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ravan — @VERSION@</title>
<style>/*STYLE*/</style>
<body><main id="app">
<header class="mast"><span class="brand">RAVAN</span><span class="demo">UI/UX demonstracija</span><nav id="nav" aria-label="Ekrani"></nav></header>
<section id="battle" class="layout">
 <section class="stage" aria-labelledby="arena-title">
  <div class="scene-head"><div><h1 id="arena-title">Kameni prolaz</h1><p id="objective">Cilj · Savladaj Tihog lovca.</p></div><button id="view" aria-pressed="false">2D prikaz</button></div>
  <div class="frame"><canvas id="arena" width="960" height="570" aria-label="Hex tabla"></canvas></div>
  <div class="board-foot"><span id="hex">Pomeri pokazivac preko table.</span><span id="selection"></span></div>
 </section>
 <aside class="panel" aria-label="Borbene komande">
  <div id="turn"></div><h2>Akcije</h2><div id="actions"></div>
  <div id="action-panel"></div><p id="message" role="status"></p>
  <h2>Druzina</h2><div id="roster"></div>
  <details><summary>Prikaz i detalji</summary><div id="detail-actions"></div></details>
 </aside>
</section>
<section id="screen" hidden></section>
<footer><span>@VERSION@ · probni podaci</span><span>GFX-06 osnova · @SOURCE@</span></footer>
</main>
<script>/*ASSETS*/</script><script>/*RENDERER*/</script><script>/*DEMO*/</script>
</body></html>
